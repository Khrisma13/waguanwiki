<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>群友名录 · 导航</title>
    <meta name="robots" content="noindex, nofollow" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background: #F5F7FA;
            color: #212121;
            min-height: 100vh;
        }
        .navbar {
            height: 64px;
            background: #FFFFFF;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #212121;
        }
        .navbar-brand .material-icons { color: #1565C0; font-size: 28px; }
        .navbar-brand span { color: #1565C0; }
        .member-badge {
            background: #E3F2FD;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #1565C0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 32px 60px;
        }
        .page-header { margin-bottom: 36px; }
        .page-header h1 { font-size: 28px; font-weight: 700; }
        .page-header p { color: #616161; font-size: 16px; margin-top: 4px; }
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 28px;
        }
        .member-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 24px 16px 20px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: block;
            border: 1px solid #F0F0F0;
        }
        .member-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.10);
            border-color: #BBDEFB;
        }
        .member-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 12px;
            display: block;
            background: #ECEFF1;
            border: 2px solid #CFD8DC;
        }
        .member-name { font-size: 18px; font-weight: 700; }
        .member-tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 500;
            color: #1565C0;
            background: #E3F2FD;
            padding: 2px 14px;
            border-radius: 12px;
            margin-top: 4px;
        }
        .card-hint {
            margin-top: 14px;
            font-size: 13px;
            color: #9E9E9E;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .card-hint .material-icons { font-size: 16px; }
        @media (max-width: 768px) {
            .navbar { padding: 0 16px; }
            .navbar-brand { font-size: 17px; }
            .container { padding: 24px 16px 40px; }
            .member-grid { gap: 16px; }
            .member-avatar { width: 80px; height: 80px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <span class="material-icons">archive</span>
            群友<span>档案馆</span>
        </div>
        <span class="member-badge">👥 2 位群友</span>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>📖 群友名录</h1>
            <p>点击卡片浏览每位群友的专属档案</p>
        </div>

        <div class="member-grid">
            <a href="youzi.html" class="member-card">
                <img src="avatars/youzi.png" alt="柚子" class="member-avatar" onerror="this.style.display='none'">
                <div class="member-name">柚子</div>
                <div class="member-tag">✨ 群友</div>
                <div class="card-hint"><span class="material-icons">chevron_right</span> 查看档案</div>
            </a>

            <a href="luobo.html" class="member-card">
                <img src="avatars/luobo.png" alt="萝卜" class="member-avatar" onerror="this.style.display='none'">
                <div class="member-name">萝卜</div>
                <div class="member-tag">🧠 群友</div>
                <div class="card-hint"><span class="material-icons">chevron_right</span> 查看档案</div>
            </a>
        </div>
    </div>

</body>
</html>

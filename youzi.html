
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>柚子 · 群友档案</title>
    <meta name="robots" content="noindex, nofollow" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background: #F5F7FA;
            color: #212121;
            min-height: 100vh;
        }
        .navbar {
            height: 64px;
            background: #FFFFFF;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 16px 0 8px;
            position: sticky;
            top:0; z-index:10;
        }
        .btn-back {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            color: #616161;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .btn-back:hover { background:#F5F5F5; color:#212121; }
        .btn-back .material-icons { font-size:22px; }
        .nav-title {
            font-size:18px;
            font-weight:700;
            color:#212121;
            margin-left:8px;
        }
        .container {
            max-width:900px;
            margin:0 auto;
            padding:32px 24px 60px;
        }
        .profile-card {
            background:#FFFFFF;
            border-radius:16px;
            box-shadow:0 1px 4px rgba(0,0,0,0.06);
            padding:32px 36px;
            display:flex;
            gap:32px;
            align-items:center;
            margin-bottom:28px;
            flex-wrap:wrap;
            border:1px solid #F0F0F0;
        }
        .avatar-large {
            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid #CFD8DC;
            background:#ECEFF1;
            flex-shrink:0;
        }
        .profile-info { flex:1; min-width:200px; }
        .profile-info .name { font-size:28px; font-weight:700; }
        .profile-info .sub { color:#616161; font-size:15px; margin-top:2px; }
        .profile-info .bio {
            margin-top:14px;
            font-size:16px;
            line-height:1.7;
            background:#E3F2FD;
            padding:16px 20px;
            border-radius:8px;
            border-left:4px solid #1565C0;
            color:#212121;
        }
        .section {
            background:#FFFFFF;
            border-radius:16px;
            box-shadow:0 1px 4px rgba(0,0,0,0.06);
            padding:28px 32px;
            margin-bottom:24px;
            border:1px solid #F0F0F0;
        }
        .section-title {
            display:flex;
            align-items:center;
            gap:10px;
            font-size:18px;
            font-weight:700;
            margin-bottom:18px;
        }
        .section-title .material-icons { color:#1565C0; font-size:24px; }
        .event-list { list-style:none; padding:0; }
        .event-item {
            display:flex;
            gap:16px;
            padding:12px 0;
            border-bottom:1px solid #F0F0F0;
            align-items:flex-start;
        }
        .event-item:last-child { border-bottom:none; }
        .event-bullet {
            width:10px; height:10px;
            border-radius:50%;
            background:#1565C0;
            flex-shrink:0;
            margin-top:6px;
            position:relative;
        }
        .event-bullet::after {
            content:'';
            position:absolute;
            top:14px; left:50%;
            transform:translateX(-50%);
            width:2px;
            height:calc(100% + 12px);
            background:#E0E0E0;
        }
        .event-item:last-child .event-bullet::after { display:none; }
        .event-text { font-size:15px; line-height:1.6; }
        .event-text .date { font-weight:600; color:#1565C0; margin-right:8px; }
        .quote-list { list-style:none; padding:0; display:flex; flex-direction:column; gap:14px; }
        .quote-item {
            display:flex;
            gap:14px;
            align-items:flex-start;
            padding:14px 18px;
            background:#FAFAFA;
            border-radius:8px;
            border-left:4px solid #FF6D00;
        }
        .quote-item .q-icon { color:#FF6D00; font-size:20px; flex-shrink:0; margin-top:2px; }
        .quote-item blockquote {
            font-size:15px;
            line-height:1.7;
            font-style:italic;
            margin:0;
        }
        .quote-item blockquote::before { content:"“"; color:#FF6D00; font-weight:700; opacity:0.6; }
        .quote-item blockquote::after { content:"”"; color:#FF6D00; font-weight:700; opacity:0.6; }
        @media (max-width:768px) {
            .container { padding:20px 16px 40px; }
            .profile-card {
                padding:24px 20px;
                flex-direction:column;
                align-items:center;
                text-align:center;
                gap:16px;
            }
            .avatar-large { width:96px; height:96px; }
            .profile-info .name { font-size:24px; }
            .profile-info .bio { text-align:left; font-size:15px; padding:14px 16px; }
            .section { padding:20px 18px; }
            .btn-back span { display:none; }
            .nav-title { font-size:16px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="home.html" class="btn-back">
            <span class="material-icons">arrow_back</span>
            <span>返回</span>
        </a>
        <span class="nav-title">柚子</span>
    </nav>

    <div class="container">
        <div class="profile-card">
            <img src="avatars/youzi.png" alt="柚子" class="avatar-large" onerror="this.style.display='none'">
            <div class="profile-info">
                <div class="name">柚子</div>
                <div class="sub">📌 群友档案 · #youzi</div>
                <div class="bio" id="bio">加载中…</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title"><span class="material-icons">history</span> 事迹</div>
            <ul class="event-list" id="eventList"></ul>
        </div>

        <div class="section">
            <div class="section-title"><span class="material-icons">format_quote</span> 语录</div>
            <ul class="quote-list" id="quoteList"></ul>
        </div>
    </div>

    <script>
        // 解密密钥由 Worker 注入
        const KEY = window.DECRYPT_KEY;
        if (!KEY) {
            document.body.innerHTML = '<div style="padding:40px;text-align:center;color:red;">错误：无法获取解密密钥，请确认已通过身份验证。</div>';
            throw new Error('DECRYPT_KEY not available');
        }

        // 解密函数（与生成器中的 decrypt 相同）
        function decrypt(encoded, key) {
            const binary = atob(encoded);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const decoder = new TextDecoder();
            const xorResult = decoder.decode(bytes);
            let result = '';
            for (let i = 0; i < xorResult.length; i++) {
                result += String.fromCharCode(xorResult.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return result;
        }

        // 加密数据（由生成器填充）
        const encryptedData = {
            bio: "57+F6Ya+55un5b2o5b6q5p+q772p5rCK6L+s5YW35ruU5rWa5Yup5Lmt6Zmb5YSg44G05paF6K6I5L2l5peE5L2g5Z2R772+5oGY6IKV5bmP5pyT5q2H56yj5ZK85rib5pqj44Gj",
            events: ["U0JRXEdGVE7nu7Tnu7XnrJnkuaHmrZPnv4flh63muZHmibnmtZ7liprvvLzngovnh7bku6flpZXlr5Xnm6zngoTmgrPjgac=","U0JRXEdGVk7liKvkva7nvpHmrK3jgbjmnrnlrLjnm63lpbnlpYzjgLnvvLzmiKLkuI/nv4Xlh7flvqbllZnmmpvnmpjjgac=","U0JRXEdGU07nrabliKDluYPkuZrmjbPnv4flh63nu5bkubzogL/kvKjvvLzmsKbmsK7miqjmupPjgaE=","U0JRXEdGXE7lj6HotYXjgLnmrq7mlpfkuaPmnrLjgaTmm6Dlvqbpl5zlgKnorpPliKfvva3lnKjmjaLohpvkuqPjgbQ="],
            quotes: ["55W+5rWJ5bGS5YKn5p6z5aym772p6YWK55Ss6IeY55+Q772t5Ly05Zq95ZCb5paJ56iB44Gn","5b2h5b6x5bGS5625772l5Lm75b2l5b+x5bCB6L+15Lyv5YWe5Ye/562y772p","57+F6Ya+55un5q6n5Lmp5Lmc5Luf6YOP5pif5oij55qx5a+86Ja977y9","6ZmS5YS75qyA5aSV772l5b+Y6aKr5Li/54eV77y+5Lu/5aWI5Lit6Kei5YuI5rOQ6bmb772k"]
        };

        document.addEventListener('DOMContentLoaded', function() {
            // 简介
            document.getElementById('bio').textContent = decrypt(encryptedData.bio, KEY);

            // 事迹
            const eventList = document.getElementById('eventList');
            encryptedData.events.forEach((enc) => {
                const full = decrypt(enc, KEY);
                const parts = full.split('|');
                const date = parts[0] || '';
                const desc = parts.slice(1).join('|') || full;
                const li = document.createElement('li');
                li.className = 'event-item';
                const bullet = document.createElement('div');
                bullet.className = 'event-bullet';
                const textDiv = document.createElement('div');
                textDiv.className = 'event-text';
                textDiv.innerHTML = '<span class="date">' + date + '</span>' + desc;
                li.appendChild(bullet);
                li.appendChild(textDiv);
                eventList.appendChild(li);
            });

            // 语录
            const quoteList = document.getElementById('quoteList');
            encryptedData.quotes.forEach((enc) => {
                const text = decrypt(enc, KEY);
                const li = document.createElement('li');
                li.className = 'quote-item';
                const icon = document.createElement('span');
                icon.className = 'q-icon material-icons';
                icon.textContent = 'format_quote';
                const blockquote = document.createElement('blockquote');
                blockquote.textContent = text;
                li.appendChild(icon);
                li.appendChild(blockquote);
                quoteList.appendChild(li);
            });
        });
    </script>
</body>
</html>
